<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    <link rel="stylesheet" href="/style/style.css">
    <link rel="icon" type="image/x-icon" href="/images/logo2.png">
</head>

<body>
    <header>
        <!--Image-->
        <!--Navigatie-->
        <div class="topnav">
            <a class="#home" href="#home">Home</a>
            <a id="admin" href="#about">Admin</a>
            <a id="login" href="#contact">Login</a>
            <input id="zoekbalk" type="text" placeholder="Search..">
        </div>
    </header>

    <main>
        <!-- Featured/Hero Section -->
        <section class="hero">
            <div class="hero-content">
                <h1>Featured Title</h1>
                <p>Experience amazing content</p>
                <div class="hero-buttons">
                    <button class="btn btn-play">▶ Play</button>
                    <button class="btn btn-info">ℹ More Info</button>
                </div>
            </div>
        </section>

        <!-- Trending Now Section -->
        <section class="content-section">
            <h2 class="section-title">Trending Now</h2>
            <div class="movie-row">
                <div class="movie-card">
                    <img src="images/logo2.png" alt="Movie 1">
                </div>
                <div class="movie-card">
                    <img src="images/logo2.png" alt="Movie 2">
                </div>
                <div class="movie-card">
                    <img src="images/logo2.png" alt="Movie 3">
                </div>
                <div class="movie-card">
                    <img src="images/logo2.png" alt="Movie 4">
                </div>
                <div class="movie-card">
                    <img src="images/logo2.png" alt="Movie 5">
                </div>
                <div class="movie-card">
                    <img src="images/logo2.png" alt="Movie 6">
                </div>
            </div>
        </section>

        <!-- Popular Section -->
        <section class="content-section">
            <h2 class="section-title">Popular on Netflix</h2>
            <div class="movie-row">
                <div class="movie-card">
                    <img src="images/logo2.png" alt="Movie 1">
                </div>
                <div class="movie-card">
                    <img src="images/logo2.png" alt="Movie 2">
                </div>
                <div class="movie-card">
                    <img src="images/logo2.png" alt="Movie 3">
                </div>
                <div class="movie-card">
                    <img src="images/logo2.png" alt="Movie 4">
                </div>
                <div class="movie-card">
                    <img src="images/logo2.png" alt="Movie 5">
                </div>
                <div class="movie-card">
                    <img src="images/logo2.png" alt="Movie 6">
                </div>
            </div>
        </section>

        <!-- Your Watchlist Section -->
        <section class="content-section">
            <h2 class="section-title">Continue Watching</h2>
            <div class="movie-row">
                <div class="movie-card">
                    <img src="images/logo2.png" alt="Movie 1">
                </div>
                <div class="movie-card">
                    <img src="images/logo2.png" alt="Movie 2">
                </div>
                <div class="movie-card">
                    <img src="images/logo2.png" alt="Movie 3">
                </div>
                <div class="movie-card">
                    <img src="images/logo2.png" alt="Movie 4">
                </div>
                <div class="movie-card">
                    <img src="images/logo2.png" alt="Movie 5">
                </div>
                <div class="movie-card">
                    <img src="images/logo2.png" alt="Movie 6">
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h4>Company</h4>
                <ul>
                    <li><a href="#">About Us</a></li>
                    <li><a href="#">Jobs</a></li>
                    <li><a href="#">Press</a></li>
                </ul>
            </div>
            <div class="footer-section">
                <h4>Help</h4>
                <ul>
                    <li><a href="#">Contact Us</a></li>
                    <li><a href="#">FAQ</a></li>
                    <li><a href="#">Support</a></li>
                </ul>
            </div>
            <div class="footer-section">
